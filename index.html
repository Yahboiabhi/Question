<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- / makes text display correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- / makes it work on phones -->
  <title>Be My Valentine?</title> <!-- / browser tab title -->
  <link rel="stylesheet" href="style.css"> <!-- / connects your CSS file -->
</head>
<body>

  <div class="container"> <!-- / main box holding the content -->
    <h1>Will you be my Valentine? 💘</h1> <!-- / question text -->

    <div class="buttons"> <!-- / play area for buttons -->
      <button id="yesBtn">Yes ❤️</button> <!-- / yes button -->
      <button id="noBtn">No 💔</button> <!-- / no button (moves when clicked) -->
    </div>

    <p id="message"></p> <!-- / teasing and yes messages appear here -->
  </div>

  <div id="fullScreenImage"> <!-- / full screen overlay that shows after Yes -->
    <img src="your-image.jpg" alt="Valentine Surprise"> <!-- / replace with your real image file -->
  </div>

  <script src="script.js"></script> <!-- / connects your JavaScript file -->
</body>
</html>
