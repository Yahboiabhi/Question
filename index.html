<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- / text encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- / mobile support -->
  <title>Be My Valentine?</title> <!-- / tab title -->
  <link rel="stylesheet" href="style.css"> <!-- / link CSS -->
</head>
<body>

  <div class="container"> <!-- / main box -->
    <h1>Will you be my Valentine? 💘</h1> <!-- / heading -->

    <div class="buttons"> <!-- / button playground -->
      <button id="yesBtn">Yes ❤️</button> <!-- / yes button -->
      <button id="noBtn">No 💔</button> <!-- / no button -->
    </div>

    <p id="message"></p> <!-- / message text -->
  </div>

  <script src="script.js"></script> <!-- / link JS -->
</body>
</html>
