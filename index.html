<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- / text encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- / phone support -->
  <title>Be My Valentine?</title> <!-- / tab title -->
  <link rel="stylesheet" href="style.css"> <!-- / load css -->
</head>
<body>

  <div class="container"> <!-- / main box -->
    <h1>Will you be my Valentine? 💘</h1> <!-- / heading -->

    <div class="buttons"> <!-- / movement boundary -->
      <button id="yesBtn" type="button">Yes ❤️</button> <!-- / yes button -->
      <button id="noBtn" type="button">No 💔</button> <!-- / no button moves on click -->
    </div>

    <p id="message"></p> <!-- / message area -->
  </div>

  <script src="script.js"></script> <!-- / load js -->
</body>
</html>
